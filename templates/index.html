<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skin Lesion Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>🩺 Skin Lesion Detection</h1>
    <p class="subtitle">AI-assisted skin lesion classification</p>

    <form method="POST" action="/predict" enctype="multipart/form-data">
    <input type="file" name="image" accept="image/*" required>
    <button type="submit">Detect</button>
</form>


    {% if result %}
    <div class="result-card">
        <h2 class="{{ 'benign' if result == 'Benign' else 'malignant' }}">
            {{ result }}
        </h2>

        <div class="confidence">
            <span>Confidence: {{ confidence }}%</span>
            <div class="bar">
                <div class="fill" style="width: {{ confidence }}%"></div>
            </div>
        </div>
    </div>
    {% endif %}

    <p class="disclaimer">⚠ This is not a medical diagnosis.</p>
</div>

<script>
function previewImage(event) {
    const img = document.getElementById("preview");
    img.src = URL.createObjectURL(event.target.files[0]);
    img.style.display = "block";
}
</script>

</body>
</html>
